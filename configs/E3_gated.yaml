# Experiment E3: Effect of Attention Gates (Gated U-Net, IR + Canny input, No Sobel loss)
experiment:
  id: "E3"
  name: "E3_gated"
  description: "Gated U-Net with IR + Canny input and no Sobel loss"
  generator_type: "gated_unet"   # original_unet | gated_unet
  in_channels_G: 2
  out_channels_G: 3
  ngf: 64
  use_sobel_loss: false

dataset:
  pairs_csv: "datasets/llvip_pairs.csv"
  annotations: "LLVIP/Annotations"
  image_size: [256, 256]
  num_workers: 4

training:
  batch_size: 8
  epochs: 100
  lr_G: 0.0002
  lr_D: 0.0002
  beta1: 0.5
  beta2: 0.999
  lr_decay_start: 50
  save_every: 10
  sample_every: 500

loss:
  gan_mode: "lsgan"
  lambda_gan: 1.0
  lambda_l1: 100.0
  lambda_sobel: 0.0
  lambda_vgg: 5.0

paths:
  checkpoints: "experiments/E3_gated/checkpoints"
  logs: "experiments/E3_gated/logs"
  samples: "experiments/E3_gated/samples"
